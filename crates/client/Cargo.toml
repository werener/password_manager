[package]
name = "password_manager_client"
version = "0.1.0"
edition = "2024"

[dependencies]
password_manager_dto = { path = "../dto" }
password_manager_crypto = { path = "../crypto" }
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde", "clock"] }
directories = "5"
hkdf = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
fd-lock = "4"

[dependencies.argon2]
version = "0.5"
features = ["std"]
